<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Notebook application for storing Notes" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Set the theme before first paint so there is no flash. Mirrors the
         resolution order in src/context/ThemeContext.tsx. Both attributes are
         set: data-theme drives the CloudBook token system, data-bs-theme keeps
         the (still-present) Bootstrap components themed until Bootstrap is removed. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = "light";
          var d = document.documentElement;
          d.setAttribute("data-theme", t);
          d.setAttribute("data-bs-theme", t);
        } catch (e) {}
      })();
    </script>

    <!-- Critical ground colour, before the CSS bundle resolves. Values match
         --surface in src/styles/tokens.css. -->
    <style>
      :root {
        background-color: #f4f1ea;
      }
      :root[data-theme="dark"] {
        background-color: #15161a;
      }
      body {
        margin: 0;
      }
    </style>

    <!-- Bootstrap 5 — technical debt. Removed once replacement primitives land
         (see src/styles/BOOTSTRAP_INVENTORY.md). -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <title>CloudBook</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://kit.fontawesome.com/b05fca42be.js" crossorigin="anonymous"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
