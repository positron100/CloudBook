<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="CloudBook — a calm digital writing desk for your notes." />
    <link rel="manifest" href="/manifest.json" />

    <!-- Set the theme before first paint so there is no flash. Mirrors the
         resolution order in src/context/ThemeContext.tsx. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <!-- Critical ground colour, before the CSS bundle resolves. Values match
         --surface in src/styles/tokens.css. -->
    <style>
      :root {
        background-color: #f4f1ea;
      }
      :root[data-theme="dark"] {
        background-color: #121317;
      }
      body {
        margin: 0;
      }
    </style>

    <link rel="preload" href="/fonts/poppins-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-600-latin.woff2" as="font" type="font/woff2" crossorigin />

    <title>CloudBook</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
